name: UI preview

on:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/client/package-lock.json
      - name: Install client dependencies
        working-directory: spike/client
        run: npm ci
      - name: Build the static preview
        working-directory: spike/client
        run: npm run preview:build
      - name: Upload the preview site
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: spike/client/preview-dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/local-callsign-keybinds-3d59'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the preview site
        uses: actions/download-artifact@v4
        with:
          name: ui-preview
          path: preview-site
      # Creating the Pages site needs a repo admin token. GITHUB_TOKEN cannot do it.
      # After Settings → Pages → Source is GitHub Actions, this configure step succeeds
      # and the same job publishes the site.
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pages site is not enabled yet
        if: steps.pages.outcome != 'success'
        run: echo "Set Settings → Pages → Source to GitHub Actions. The next push will publish https://tubss2.github.io/radio-net/"
      - name: Upload the Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
