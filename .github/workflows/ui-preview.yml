name: Web app

on:
  push:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/client/package-lock.json
      - name: Install client dependencies
        working-directory: spike/client
        run: npm ci
      - name: Build the web app
        working-directory: spike/client
        env:
          VITE_API_URL: https://radio-149-28-170-200.sslip.io
          VITE_LIVEKIT_URL: wss://lk-149-28-170-200.sslip.io
        run: npm run web:build
      - name: Build the static preview
        working-directory: spike/client
        run: npm run preview:build
      - name: Assemble the site
        run: |
          mkdir -p site/preview
          cp -a spike/client/web-dist/. site/
          cp -a spike/client/preview-dist/. site/preview/
      - name: Upload the site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-site
          path: site
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/local-callsign-keybinds-3d59'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-site
          path: site
      # Creating the Pages site needs a repo admin token. GITHUB_TOKEN cannot do it.
      # After Settings → Pages → Source is GitHub Actions, this configure step succeeds
      # and the same job publishes the site.
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Pages site is not enabled yet
        if: steps.pages.outcome != 'success'
        run: echo "Set Settings → Pages → Source to GitHub Actions. The next push will publish https://tubss2.github.io/radio-net/"
      - name: Upload the Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
