name: Windows installer

on:
  # Push is what actually runs this before the file is on the default branch.
  # A version tag (v0.4.0) publishes the GitHub Release. A manual run can also
  # publish, and can override the baked URLs once this file is on the default branch.
  push:
  workflow_dispatch:
    inputs:
      api_url:
        description: API URL baked into the client (VITE_API_URL)
        required: false
        default: https://radio-149-28-170-200.sslip.io
      livekit_url:
        description: LiveKit URL baked into the client (VITE_LIVEKIT_URL)
        required: false
        default: wss://lk-149-28-170-200.sslip.io
      publish:
        description: Publish exe, latest.yml, and blockmap to a public GitHub Release. Uncheck to only build the artifact.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    # Read-only. This job runs npm ci, so a compromised package must not receive a token that can publish.
    permissions:
      contents: read
    env:
      VITE_API_URL: ${{ github.event.inputs.api_url || 'https://radio-149-28-170-200.sslip.io' }}
      VITE_LIVEKIT_URL: ${{ github.event.inputs.livekit_url || 'wss://lk-149-28-170-200.sslip.io' }}
      # Unsigned on purpose. Do not let electron-builder look for a certificate.
      # Resource editing stays on, so the app exe file properties carry the package.json version.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/client/package-lock.json
      - name: Refuse a release build with the fake microphone
        shell: pwsh
        run: |
          if ($env:RN_FAKE_MEDIA) {
            throw "RN_FAKE_MEDIA is set to '$env:RN_FAKE_MEDIA'. Release builds must not enable the fake mic."
          }
      - name: Install client dependencies
        working-directory: spike/client
        run: npm ci
      - name: Build the app and the NSIS installer
        working-directory: spike/client
        run: npm run dist:win
      - name: Confirm the server URLs, update feed, and version
        id: installer
        working-directory: spike/client
        shell: pwsh
        run: |
          if ($env:RN_FAKE_MEDIA) { throw 'RN_FAKE_MEDIA became set during the build.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Client version '$version' is not semver." }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$($env:GITHUB_REF_NAME)' does not match package version v$version."
          }
          $renderer = Get-ChildItem -Recurse out\renderer -Filter *.js
          $api = $renderer | Select-String -SimpleMatch $env:VITE_API_URL -List
          $lk = $renderer | Select-String -SimpleMatch $env:VITE_LIVEKIT_URL -List
          $shown = $renderer | Select-String -SimpleMatch $version -List
          if (-not $api) { throw "VITE_API_URL was not baked into the renderer: $($env:VITE_API_URL)" }
          if (-not $lk) { throw "VITE_LIVEKIT_URL was not baked into the renderer: $($env:VITE_LIVEKIT_URL)" }
          if (-not $shown) { throw "App version $version was not baked into the renderer." }
          $setupName = "RadioNet-Setup-$version.exe"
          $setup = Get-Item "release\$setupName" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "$setupName was not produced." }
          if (-not (Test-Path "release\$setupName.blockmap")) { throw "$setupName.blockmap was not produced." }
          if (-not (Test-Path 'release\latest.yml')) { throw 'latest.yml was not produced.' }
          $feed = Get-Content 'release\win-unpacked\resources\app-update.yml' -Raw
          foreach ($pattern in @('provider:\s+github', 'owner:\s+Tubss2', 'repo:\s+radio-net')) {
            if ($feed -notmatch $pattern) {
              throw "app-update.yml is missing $($pattern):`n$feed"
            }
          }
          if ($feed -match 'publisherName') { throw "Unsigned build must not set publisherName:`n$feed" }
          if ($feed -match '(?i)token:') { throw "app-update.yml must not contain a token:`n$feed" }
          $latest = Get-Content 'release\latest.yml' -Raw
          if ($latest -notmatch "version:\s*$([regex]::Escape($version))") { throw "latest.yml version does not match $version`n$latest" }
          $app = Get-Item 'release\win-unpacked\RadioNet.exe'
          function Assert-Version($label, $info) {
            $file = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart)"
            $product = "$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart)"
            if ($info.FileVersion -notlike "$version*" -or $file -ne $version) {
              throw "$label FileVersion is '$($info.FileVersion)' ($file), expected $version"
            }
            if ($info.ProductVersion -notlike "$version*" -or $product -ne $version) {
              throw "$label ProductVersion is '$($info.ProductVersion)' ($product), expected $version"
            }
          }
          Assert-Version $setupName $setup.VersionInfo
          Assert-Version 'RadioNet.exe' $app.VersionInfo
          "version=$version" >> $env:GITHUB_OUTPUT
          "file=$setupName" >> $env:GITHUB_OUTPUT
      - name: Write SHA256SUMS for the installer
        if: steps.installer.outcome == 'success'
        working-directory: spike/client
        shell: pwsh
        run: |
          $file = "${{ steps.installer.outputs.file }}"
          $hash = (Get-FileHash "release\$file" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii "release\SHA256SUMS.txt" "$hash  $file"
          Set-Content -Encoding ascii "release\version.txt" "${{ steps.installer.outputs.version }}"
          Copy-Item release-notes.md release\release-notes.md
      - name: Upload the installer, blockmap, and latest.yml
        if: always() && steps.installer.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RadioNet-Setup
          path: |
            spike/client/release/${{ steps.installer.outputs.file }}
            spike/client/release/${{ steps.installer.outputs.file }}.blockmap
            spike/client/release/latest.yml
            spike/client/release/SHA256SUMS.txt
            spike/client/release/version.txt
            spike/client/release/release-notes.md
          if-no-files-found: error

  # Publishes only for a v* tag, or a manual run with publish left on.
  # Settings → Environments → release should require Tobias as a reviewer.
  # Until that rule exists, a tag still publishes, but the build job cannot.
  publish:
    needs: installer
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the built installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RadioNet-Setup
          path: dist
      - name: Publish the installer to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          function Find-One($name) {
            $hits = @(Get-ChildItem -Recurse dist -File | Where-Object { $_.Name -eq $name })
            if ($hits.Count -ne 1) { throw "Expected one $name, found $($hits.Count)" }
            return $hits[0].FullName
          }
          $version = (Get-Content (Find-One 'version.txt') -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Bad version '$version'" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$($env:GITHUB_REF_NAME)' does not match package version v$version."
          }
          $fileName = "RadioNet-Setup-$version.exe"
          $exe = Find-One $fileName
          $blockmap = Find-One "$fileName.blockmap"
          $latest = Find-One 'latest.yml'
          $sums = Find-One 'SHA256SUMS.txt'
          $notes = Find-One 'release-notes.md'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $listed = (Get-Content $sums -Raw).Trim()
          if ($listed -ne "$hash  $fileName") { throw "SHA256SUMS.txt does not match $fileName" }
          $tag = "v$version"
          # This job does not check out the repo, so gh cannot discover it from git.
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_REPOSITORY)) { throw "Missing repository" }
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe $blockmap $latest $sums --repo $repo --target $env:GITHUB_SHA --title $version --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not create the $tag release" }
          } else {
            gh release upload $tag $exe $blockmap $latest $sums --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload the $tag installer assets" }
          }
          # electron-updater reads GitHub's Latest release for latest.yml.
          # A helper release must not stay Latest. This does not replace helper files.
          gh release edit $tag --repo $repo --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not mark $tag as the latest release" }
