name: PTT helper

# Builds the Windows helper window and keeps the Actions artifact.
# RadioNetHelper.exe is attached to the helper-4 release only on main.
# Pull requests do not publish a release. The tag does not start with v,
# and this job does not publish the desktop installer, so installed clients
# do not treat the helper as an app update.

on:
  push:
    paths:
      - 'helper/**'
      - '.github/workflows/ptt-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: Build RadioNetHelper.exe
        working-directory: helper
        run: cargo build --release
      - name: Upload the helper exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RadioNetHelper
          path: helper/target/release/RadioNetHelper.exe
          if-no-files-found: error
      - name: Attach RadioNetHelper.exe to the helper-4 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = "helper/target/release/RadioNetHelper.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $tag = "helper-4"
          $notes = "Windows helper window for the web app. It stays on screen. Talk is F1, previous channel is F3, and next channel is F4, and each key has a red test light. It exits when you close it. It does not see the microphone. Source: https://github.com/Tubss2/radio-net/tree/main/helper"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "Radio Net helper" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish RadioNetHelper.exe on $tag" }
