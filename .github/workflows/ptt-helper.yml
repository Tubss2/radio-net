name: PTT helper

# Builds the Windows helper window and uploads the Actions artifact.
# A merge to main publishes the next helper-N tag. No one has to start the
# workflow or type an approval phrase. The merged pull request must have a
# comment or review that starts with "Security review: approved", written by
# Tubss2 or by cursor[bot] through the cursor app. A review that requests
# changes does not count. The run refuses to upload onto a tag
# that already exists. The tag does not start with v, it is not marked as
# the repository's latest release, and this job does not publish the desktop
# installer, so installed clients do not treat the helper as an app update.
# After that tag exists, point HELPER_DOWNLOAD_URL at it.

on:
  push:
    paths:
      - 'helper/**'
      - '.github/workflows/ptt-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: Build RadioNetHelper.exe
        working-directory: helper
        run: cargo build --release --locked
      - name: Upload the helper exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RadioNetHelper
          path: helper/target/release/RadioNetHelper.exe
          if-no-files-found: error

  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Download RadioNetHelper.exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RadioNetHelper
          path: helper-dist
      - name: Create the next helper-N release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELPER_TARGET: ${{ github.sha }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = "helper-dist/RadioNetHelper.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if ([string]::IsNullOrWhiteSpace($env:HELPER_TARGET)) { throw "Missing target commit" }
          $repo = $env:GITHUB_REPOSITORY
          $numbers = gh api "repos/$repo/commits/$env:HELPER_TARGET/pulls" --jq '.[] | select(.merged_at != null) | .number'
          if ($LASTEXITCODE -ne 0) { throw "Could not list pull requests for this commit" }
          $approved = $false
          function Add-TrustedApproval($item, $isReview) {
            if ($null -eq $item) { return }
            if ($isReview -and "$($item.state)" -ceq 'CHANGES_REQUESTED') { return }
            $login = "$($item.user.login)"
            $slug = "$($item.performed_via_github_app.slug)"
            $trusted = ($login -ceq 'Tubss2') -or (($login -ceq 'cursor[bot]') -and ($slug -ceq 'cursor'))
            if (-not $trusted) { return }
            if ("$($item.body)" -cmatch '^Security review: approved') { $script:approved = $true }
          }
          foreach ($n in @($numbers)) {
            $id = "$n".Trim()
            if ($id -notmatch '^\d+$') { continue }
            $commentJson = gh api --paginate "repos/$repo/issues/$id/comments"
            if ($LASTEXITCODE -ne 0) { throw "Could not read comments on pull request $id" }
            $commentItems = ConvertFrom-Json $commentJson
            if ($null -ne $commentItems) {
              foreach ($item in @($commentItems)) { Add-TrustedApproval $item $false }
            }
            $reviewJson = gh api --paginate "repos/$repo/pulls/$id/reviews"
            if ($LASTEXITCODE -ne 0) { throw "Could not read reviews on pull request $id" }
            $reviewItems = ConvertFrom-Json $reviewJson
            if ($null -ne $reviewItems) {
              foreach ($item in @($reviewItems)) { Add-TrustedApproval $item $true }
            }
          }
          if (-not $approved) { throw "Refusing to publish. The merged pull request has no security review approval." }
          $raw = gh api --paginate "repos/$repo/git/matching-refs/tags/helper-" --jq ".[].ref"
          if ($LASTEXITCODE -ne 0) { throw "Could not list helper tags" }
          $max = 0
          foreach ($ref in @($raw)) {
            $line = "$ref".Trim()
            if ($line -match '^refs/tags/helper-(\d+)$') {
              $n = [int64]$Matches[1]
              if ($n -gt $max) { $max = $n }
            }
          }
          if ($max -lt 1) { throw "No helper-N tag found. Refusing to guess a first release." }
          $tag = "helper-$($max + 1)"
          if ($tag -notmatch '^helper-\d+$') { throw "Refusing tag $tag" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $sums = "helper-dist/SHA256SUMS.txt"
          Set-Content -Encoding ascii $sums "$hash  RadioNetHelper.exe"
          gh release view $tag --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw "$tag already exists. Refusing to replace a published exe." }
          $notes = "Windows helper window for the web app. Talk is F1, previous channel is F3, and next channel is F4. Each key has a red test light. The window stays on screen and the process exits when you close it. It does not see the microphone. This tag is left as published. A later helper build is a new tag. Source: https://github.com/$repo/tree/main/helper"
          gh release create $tag $exe $sums --repo $repo --target $env:HELPER_TARGET --latest=false --title "Radio Net helper $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not create $tag" }
          $seen = gh release view $tag --repo $repo --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw "Could not read $tag after creating it" }
          if ($seen.Trim() -ne $tag) { throw "Published tag was '$seen', expected $tag" }
          Write-Host "Published $tag. Point HELPER_DOWNLOAD_URL at https://github.com/$repo/releases/download/$tag/RadioNetHelper.exe"
