<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radio Net channel wheel</title>
<style>
  html, body { margin: 0; width: 1200px; height: 800px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 18%, rgba(0,0,0,.45) 70%),
      repeating-linear-gradient(102deg, transparent 0 46px, rgba(212, 160, 32, .9) 46px 70px, transparent 70px 150px),
      linear-gradient(90deg, #2a261f 0 68%, #3d4634 68% 78%, #2c3326 78% 100%),
      linear-gradient(#3a342c, #241e18);
  }
  svg { display: block; }
  .scene { position: relative; width: 1200px; height: 800px; }
  .figs { position: absolute; left: 250px; top: 18px; display: flex; gap: 28px; }
  .fig { width: 16px; height: 36px; background: linear-gradient(#f2f2f2 0 16px, #1a1a1a 16px); border-radius: 3px 3px 0 0; opacity: .85; }
  .cone { position: absolute; right: 250px; top: 28px; width: 14px; height: 22px; background: #e23b2f; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .box { position: absolute; left: 50%; top: 62%; width: 86px; height: 54px; margin-left: -43px; background: linear-gradient(#c4362a, #8e241c); border-radius: 4px; box-shadow: 0 8px 0 #d6b01e; }
</style>
</head>
<body>
<div class="scene">
  <div class="figs"><div class="fig"></div><div class="fig"></div><div class="fig"></div></div>
  <div class="cone"></div>
  <div class="box"></div>
  <div id="wheel"></div>
</div>
<script>
const W = { size: 640, cx: 320, cy: 320, inner: 150, outer: 292 };

function polar(cx, cy, r, a) { return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
function angles(count) {
  const sweep = Math.PI * 2 / count;
  const a0s = -Math.PI / 2 - sweep / 2;
  return Array.from({ length: count }, (_, i) => {
    const a0 = a0s + i * sweep;
    return { a0, a1: a0 + sweep, mid: a0 + sweep / 2 };
  });
}
function segPath(a0, a1) {
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const o0 = polar(W.cx, W.cy, W.outer, a0);
  const o1 = polar(W.cx, W.cy, W.outer, a1);
  const i1 = polar(W.cx, W.cy, W.inner, a1);
  const i0 = polar(W.cx, W.cy, W.inner, a0);
  return `M ${o0.x} ${o0.y} A ${W.outer} ${W.outer} 0 ${large} 1 ${o1.x} ${o1.y} L ${i1.x} ${i1.y} A ${W.inner} ${W.inner} 0 ${large} 0 ${i0.x} ${i0.y} Z`;
}

const segs = [
  { label: 'CH1', freq: '41.250 MHz', name: 'Arty', live: true },
  { label: 'CH2', freq: '45.000 MHz', name: 'Logi', live: true, hover: true, volume: 80 },
  { label: 'CH3', freq: '59.500 MHz', name: 'Command', live: true, tx: true },
  { label: 'CH4', freq: '62.100 MHz', name: 'Alpha FT', muted: true },
  { add: true, label: '+' },
];
const ang = angles(segs.length);
const speaker = `<g fill="none" stroke="#f0c14a" stroke-width="1.8" stroke-linecap="round"><path d="M1 6h3.2L9 2.2v11.6L4.2 10H1z" fill="#f0c14a" stroke="none"/><path d="M12 4.2a5 5 0 0 1 0 7.6"/><path d="M14.2 2a8 8 0 0 1 0 12"/></g>`;
const mute = `<g fill="none" stroke="#8b939f" stroke-width="1.8" stroke-linecap="round"><path d="M1 6h3.2L9 2.2v11.6L4.2 10H1z" fill="#8b939f" stroke="none"/><path d="M12 4.5l6 7M18 4.5l-6 7"/></g>`;
const radio = `<g fill="none" stroke="#9aa3b2" stroke-width="1.7"><path d="M6 2h6M9 2v3"/><rect x="3" y="5" width="12" height="14" rx="2"/><rect x="5.5" y="7.5" width="7" height="3.5" fill="#9aa3b2" stroke="none"/><circle cx="9" cy="14.5" r="1.3" fill="#9aa3b2" stroke="none"/></g>`;

const parts = segs.map((s, i) => {
  const a = ang[i];
  const fill = s.muted ? 'rgba(52,54,60,.78)' : s.hover ? 'rgba(78,88,108,.92)' : s.tx ? 'rgba(92,70,32,.9)' : 'rgba(46,48,56,.88)';
  return `<path d="${segPath(a.a0, a.a1)}" fill="${fill}"/>`;
});
const lines = ang.map((a) => {
  const p0 = polar(W.cx, W.cy, W.inner, a.a0);
  const p1 = polar(W.cx, W.cy, W.outer, a.a0);
  return `<line x1="${p0.x}" y1="${p0.y}" x2="${p1.x}" y2="${p1.y}" stroke="rgba(255,255,255,.92)" stroke-width="2.5"/>`;
});
const labels = segs.map((s, i) => {
  const a = ang[i];
  const r = (W.inner + W.outer) / 2;
  const p = polar(W.cx, W.cy, r, a.mid);
  const ink = s.muted ? '#8b939f' : s.tx ? '#f0c14a' : '#f4f7fb';
  const dim = s.muted ? '#6e7684' : 'rgba(232,235,241,.8)';
  if (s.add) {
    return `<g transform="translate(${p.x} ${p.y})">${radio.replace('<g ', '<g transform="translate(-9 -34)" ')}<text y="22" text-anchor="middle" fill="#f4f7fb" font-size="26" font-weight="700">+</text><text y="42" text-anchor="middle" fill="${dim}" font-size="13">Add</text></g>`;
  }
  const icon = s.tx ? `<g transform="translate(-52 -16)">${speaker}</g>` : s.muted ? `<g transform="translate(-52 -16)">${mute}</g>` : '';
  const dot = s.live ? `<circle cx="46" cy="-10" r="6" fill="#3ddc97"/>` : '';
  const vol = s.volume == null ? '' : `<rect x="-44" y="48" width="88" height="6" rx="3" fill="rgba(255,255,255,.18)"/><rect x="-44" y="48" width="${88 * s.volume / 150}" height="6" rx="3" fill="#3ddc97"/><text y="72" text-anchor="middle" fill="#f4f7fb" font-size="14">${s.volume}%</text>`;
  return `<g transform="translate(${p.x} ${p.y})" font-family="Segoe UI, system-ui, sans-serif">${icon}${dot}<text y="-4" text-anchor="middle" fill="${ink}" font-size="20" font-weight="700">${s.label}</text><text y="18" text-anchor="middle" fill="${ink}" font-size="15" font-family="ui-monospace, Consolas, monospace">${s.freq}</text><text y="38" text-anchor="middle" fill="${dim}" font-size="13">${s.name}</text>${vol}</g>`;
});

document.getElementById('wheel').innerHTML = `<svg width="640" height="640" viewBox="0 0 640 640" style="position:absolute;left:280px;top:80px">${parts.join('')}<circle cx="${W.cx}" cy="${W.cy}" r="${W.outer}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/><circle cx="${W.cx}" cy="${W.cy}" r="${W.inner}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>${lines.join('')}${labels.join('')}</svg>`;
</script>
</body>
</html>
