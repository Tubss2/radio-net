[package]
name = "radionet-helper"
version = "0.1.0"
edition = "2021"
description = "Tiny Windows window that forwards push-to-talk and channel keys to the Radio Net page."
publish = false

[[bin]]
name = "RadioNetHelper"
path = "src/main.rs"

[dependencies]
getrandom = "0.2"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_UI_Input",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
